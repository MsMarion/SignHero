# ============================================
# ASL Fun Training — Local Development Stack
# ============================================
# Spin up MongoDB + MinIO with: docker compose up -d
# Tear down with: docker compose down

services:
  # ── MongoDB ────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: asl-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "4002:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      # No auth for local dev; production should use MONGO_INITDB_ROOT_USERNAME/PASSWORD
      MONGO_INITDB_DATABASE: signhero
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ───
  # NOTE: MinIO Inc. pulled minio/minio and minio/mc from Docker Hub. If `docker compose pull`
  # fails for this image on your machine, see docker-compose.override.example.yml.
  minio:
    image: minio/minio:latest
    container_name: asl-minio
    restart: unless-stopped
    ports:
      - "4003:9000"   # S3 API
      - "4004:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Auto-Setup (creates default bucket) ──
  # minio/mc is gone from Docker Hub too, so this uses the AWS CLI's S3
  # commands against MinIO's S3-compatible API instead of the mc client.
  minio-init:
    image: amazon/aws-cli:latest
    container_name: asl-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://minio:9000 s3 mb s3://signhero || true;
        aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket signhero --policy '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::signhero/*\"}]}';
        echo '✅ MinIO bucket signhero is ready';
      "
    restart: "no"

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local
