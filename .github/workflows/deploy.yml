name: Deploy to production

# On every push to main (and on demand): the self-hosted runner asks the two hosts to release this
# commit, a GitHub-hosted runner then smoke-tests the public site, and if that test fails the hosts
# THAT THIS RUN RELEASED are rolled back. The self-hosted runner never checks out the repository: all
# logic lives in /usr/local/bin/signhero-deploy on each host (root-owned), reached through a restricted
# SSH key that can only run status, backup, rollback and "deploy <sha>". The hosts fetch origin/main
# themselves and refuse any sha that is not on it.
#
# main is protected (pull request and passing CI required), so only reviewed, tested code gets here.
#
# Each deploy prints a final "RESULT: released | skipped | noop | repaired | failed" line. A host that
# reports skipped (nothing in the change affects it) or noop (already on this commit) is left alone: a
# rollback there would undo an OLDER release that this run never touched.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      drill_smoke_failure:
        description: "DRILL: make the smoke test fail on purpose (dead API URL) to prove a rollback only touches hosts this run released"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (backend, then frontend)
    runs-on: [self-hosted, signhero-deploy]
    timeout-minutes: 45
    outputs:
      ct129: ${{ steps.ct129.outputs.result }}
      ct119: ${{ steps.ct119.outputs.result }}
    steps:
      - name: Deploy the GPU backend (CT129)
        id: ct129
        shell: bash
        run: |
          out=$(ssh signhero-ct129 "deploy ${{ github.sha }}" | tee /dev/stderr)
          res=$(grep -E '^RESULT: ' <<<"$out" | tail -1 | cut -d' ' -f2)
          echo "result=${res:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Deploy the frontend (CT119)
        id: ct119
        shell: bash
        run: |
          out=$(ssh signhero-ct119 "deploy ${{ github.sha }}" | tee /dev/stderr)
          res=$(grep -E '^RESULT: ' <<<"$out" | tail -1 | cut -d' ' -f2)
          echo "result=${res:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Show the resulting status
        if: always()
        run: |
          ssh signhero-ct129 status || true
          ssh signhero-ct119 status || true

  smoke:
    name: smoke test (production)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Whack-A-Sign end to end against the public site (one retry)
        env:
          SMOKE_BASE_URL: https://asl.dawnbalaschak.com
          # The drill switch (manual runs only) swaps in a dead URL so the test fails on purpose.
          SMOKE_API_URL: ${{ inputs.drill_smoke_failure && 'https://aslapi.invalid' || 'https://aslapi.dawnbalaschak.com' }}
          SMOKE_BROWSER: "1"
          CHROME_PATH: /usr/bin/google-chrome
        # One retry: a single flaky browser run must not roll back a good release.
        run: |
          node tests/smoke/whack-smoke.mjs || {
            echo "::warning::first smoke attempt failed; retrying once in 30 s"
            sleep 30
            node tests/smoke/whack-smoke.mjs
          }

  rollback:
    name: rollback (only hosts released in this run, only if the smoke test failed)
    needs: [deploy, smoke]
    if: ${{ always() && needs.smoke.result == 'failure' }}
    runs-on: [self-hosted, signhero-deploy]
    timeout-minutes: 20
    steps:
      - name: Roll back the frontend (CT119)
        if: ${{ needs.deploy.outputs.ct119 == 'released' }}
        run: ssh signhero-ct119 rollback

      - name: Roll back the GPU backend (CT129)
        if: ${{ needs.deploy.outputs.ct129 == 'released' }}
        run: ssh signhero-ct129 rollback

      - name: Report
        env:
          CT119: ${{ needs.deploy.outputs.ct119 }}
          CT129: ${{ needs.deploy.outputs.ct129 }}
        run: |
          echo "The smoke test failed after deploying ${{ github.sha }} (CT129: $CT129, CT119: $CT119)." >&2
          if [ "$CT119" != released ] && [ "$CT129" != released ]; then
            echo "Neither host released anything in this run, so nothing was rolled back: look at the smoke test output above, the public site, or the test itself." >&2
          else
            echo "Hosts that released were rolled back to their previous release." >&2
          fi
          exit 1
