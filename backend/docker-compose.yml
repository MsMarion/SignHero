# Run the detection backend in a container with GPU access:
#   docker compose -f backend/docker-compose.yml up -d --build
# The default PyTorch build is cu126 (works on Pascal, e.g. GTX 1070). For an RTX 5090 set
#   TORCH_INDEX=https://download.pytorch.org/whl/cu128
services:
  signhero-api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu126}
    # The image tag is a variable so the deploy can keep the previous release next to the new one
    # (rollback is starting the old tag again). Unset, it is "local".
    image: signhero-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "4001:4001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
